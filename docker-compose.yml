# Deploys to the Klivo Docker hosting platform (Traefik file-provider routing).
# The container name and network embed the client slug "enzo-di-napoli"; if your platform
# client uses a different slug, regenerate with "cef generate --client-slug <slug>"
# or edit the two names below to match.
services:
  hosting_enzo-di-napoli_web:
    build: .
    container_name: hosting_enzo-di-napoli_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Pinned here, NOT left to .env. This variable and the volume mount below
      # are two halves of one decision, and splitting them across two files is
      # how they drift: if the panel's environment is missing it, the store falls
      # back to <cwd>/data — a path INSIDE the container — and every menu,
      # contact and legal edit the admin makes is written somewhere that is
      # discarded the moment the container is replaced. Silently: the site simply
      # reverts to the values baked into the build, with nothing in the logs.
      #
      # The local .env is missing it today, which is exactly that situation.
      CONTENT_DATA_DIR: /data
    expose:
      # Unprivileged, so the container needs no capability to bind it. Must match
      # PORT in the Dockerfile and the container port set in the panel.
      - '3000'
    volumes:
      # Everything the admin edits — the menu, the contact details, the company
      # data and the legal texts — is one JSON file in here. WITHOUT this volume
      # every edit is lost the moment the container is replaced, and the site
      # silently reverts to the values baked into the build.
      #
      # CONTENT_DATA_DIR in .env must point at the container path below.
      - enzo_content:/data
    networks:
      - client_enzo-di-napoli_net

    # ---- Hardening --------------------------------------------------------
    # The platform validates this file against an ALLOWLIST of compose keys and
    # rejects the deploy outright if it sees anything else. It refused both
    # `security_opt` (even `no-new-privileges:true`) and `cap_add`. It did not
    # object to `cap_drop`, which it would have reported in the same pass — it
    # lists every violation it finds — so dropping capabilities is permitted and
    # adding them back is not.
    #
    # That is why the container listens on 3000 rather than 80. Binding below
    # 1024 is privileged, so port 80 as a non-root user needs NET_BIND_SERVICE
    # handed back, and this platform will not allow that. An unprivileged port
    # needs no capability at all, which is what makes the line below safe:
    # nothing here requires a capability to start.
    #
    # The container port in the panel MUST be 3000 to match. Traefik routes to
    # whatever it is told; if it still says 80 the site answers with 502.
    cap_drop:
      - ALL

    # Deliberately NOT read_only: next/image writes optimised AVIF and WebP into
    # /app/.next/cache on first request, and the content store writes to /data.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  enzo_content:

networks:
  client_enzo-di-napoli_net:
    external: true
