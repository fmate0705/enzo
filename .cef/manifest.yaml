metadata:
  description: >-
    Enzo di Napoli is an authentic Neapolitan pizzeria, restaurant and cafe in
    Hatvan, Hungary. A hospitality venue serving wood-fired Neapolitan pizza from
    an AVPN-certified MP Forni oven, fresh Italian ingredients, traditional
    recipes, salads and desserts. The website presents the restaurant menu, the
    story, a photo gallery and how to find the venue. Table booking is by phone;
    food ordering and delivery are handled by the external Foodora platform.
